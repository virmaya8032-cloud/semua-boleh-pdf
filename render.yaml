# Blueprint Render untuk backend Semua Boleh PDF.
# Backend dibina daripada Dockerfile kerana ia memerlukan binari sistem
# (Ghostscript, qpdf, LibreOffice, Poppler, OCRmyPDF, Tesseract).
#
# Cara guna: di Render, pilih "New +" -> "Blueprint" dan halakan ke repo ini,
# atau cipta "Web Service" secara manual dengan Runtime = Docker,
# Root Directory = backend.

services:
  - type: web
    name: semua-boleh-pdf-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter          # 'free' juga boleh, tetapi LibreOffice perlukan lebih memori
    healthCheckPath: /api/kesihatan
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true      # Render jana rahsia rawak automatik
      - key: JWT_EXPIRES
        value: 7d
      - key: MAX_FILE_MB
        value: 50
      - key: FILE_TTL_MIN
        value: 30
      # --- Isi nilai berikut secara manual dalam dashboard Render ---
      - key: DATABASE_URL
        sync: false              # Tampal connection string Neon anda
      - key: CORS_ORIGINS
        sync: false              # cth: https://laman-anda.netlify.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAMA
        value: Pentadbir
